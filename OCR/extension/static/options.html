<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>本機 OCR 設定</title><link rel="stylesheet" href="ui.css"></head><body><main><h1>本機 OCR 設定</h1><p>OCR 在擴充功能的 Web Worker 執行，首次辨識才載入。圖片、辨識結果與帳密不會存入設定；沒有雲端備援或辨識記錄。</p><form id="settings"><label>Worker 閒置釋放時間（1–30 分鐘）<input id="idle" type="number" min="1" max="30" required></label><label>裁切圖大小上限（KB）<input id="bytes" type="number" min="1" max="8192" required></label><label>裁切圖像素上限<input id="pixels" type="number" min="1000" max="8000000" required></label><label>辨識逾時（秒，含首次初始化）<input id="timeout" type="number" min="1" max="120" required></label><button class="primary">儲存</button></form><p id="status" role="status"></p><h2>已記住的配對</h2><p>只比對 origin 與完整 pathname；不保存 query／fragment。頁面路徑及元素識別仍可能含個人資訊，請僅保存你願意留在本機的設定。</p><ul id="profiles"></ul><p><small>跨來源 iframe、Shadow DOM 內元素、動畫圖片或拒絕合成事件的表單不在 MVP 支援範圍。OCR 建議需自行確認。</small></p></main><script type="module" src="options.js"></script></body></html>
